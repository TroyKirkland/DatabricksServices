# Databricks Product Docs — Control File
# ------------------------------------------------------------
# Source of truth for the per-product L100→L400 doc set.
# Edit this file to add / remove / rename / re-status products,
# then regenerate by re-running the same prompt against Claude.
#
# Author: Troy Kirkland  (troy.kirkland@databricks.com)
# Generated: 2026-05-19

meta:
  output_root: /Users/troy.kirkland/Documents/Automation/Services
  glossary_folder: Glossary
  file_naming:
    folder_case: PascalCase            # e.g. LakeflowConnect
    file_case: kebab-case              # e.g. lakeflow-connect.md
    formats: [md, html]
  cross_reference:
    # Every product doc links to Glossary for shared terms.
    glossary_md: ../Glossary/glossary.md
    glossary_html: ../Glossary/glossary.html

# ------------------------------------------------------------
# Process / template
# Every product doc MUST contain the following sections, in order.
# Glossary is exempt (it is a flat term list).
# ------------------------------------------------------------
template:
  sections:
    - id: l100
      title: "Level 100 — What it is"
      depth: "elevator pitch + 3 takeaways. No jargon."
    - id: l200
      title: "Level 200 — The product surface"
      depth: "core objects/APIs the user creates; supported variants; how you author it (UI/API/DAB)."
    - id: l300
      title: "Level 300 — Architecture"
      depth: "components + data flow diagram; compute model; security/governance integration; key trade-offs."
    - id: l400
      title: "Level 400 — Deep internals"
      depth: "deep internals: storage layout, protocols, checkpoints, concurrency, fault tolerance, hard limits, mental model."
    - id: anti_patterns
      title: "Anti-patterns — where you should not use it"
      depth: "10 wrong-tool cases. Always recommend the right alternative."
    - id: weaknesses
      title: "Weaknesses — areas it does not do well"
      depth: "10-12 real limitations to design around even when this IS the right tool."
    - id: sources
      title: "Sources"
      depth: "links to authoritative docs/blogs used during writing."

  style:
    voice: "field-engineer technical, opinionated, no marketing fluff"
    code_blocks: "ASCII diagrams welcome; SQL/Python snippets short and load-bearing only"
    cross_links: "[[glossary:term]] for any term defined in Glossary"

