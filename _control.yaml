# ------------------------------------------------------------
# Topic pipelines
# These are NOT L100→L400 product docs — they generate visual artefacts
# from external data sources. Not driven by the regeneration prompt below.
# ------------------------------------------------------------
topics:

  - name: product-evolution
    title: Product Evolution
    folder: ProductEvolution
    status: complete
    summary: "Visual reference of Databricks product launches, renames, sunsets, acquisitions, and multi-rename chains."
    outputs:
      - product-evolution.png      # rendered timeline (rsvg-convert from .svg)
      - product-evolution.svg      # hand-authored SVG, single source for the PNG
      - product-evolution.md       # source narrative + tables + Mermaid blocks
      - product-evolution.mmd      # standalone Mermaid timeline for external rendering
    rendering: "rsvg-convert -w 2400 product-evolution.svg -o product-evolution.png  (NOT mmdc — see memory:diagram-rendering)"

  - name: feature-timelines
    title: Feature Timelines (per product)
    folder: ProductEvolution/by-product
    status: complete
    summary: "Per-product month-by-month timelines of GA/Public Preview/Beta events scraped from docs.databricks.com release notes."
    pipeline:
      - feature-scraper.py         # stdlib + urllib; scrapes docs.databricks.com/aws/en/release-notes/product/{year}/{month}
      - feature-classifier.py      # Anthropic API (Haiku 4.5) via stdlib urllib if ANTHROPIC_API_KEY is set; keyword fallback otherwise
      - feature-timeline.py        # SVG per bucket -> rsvg-convert to PNG
      - refresh.sh                 # one-command orchestrator (weekly/monthly cadence)
    buckets:                       # mirror feature-classifier.py TAXONOMY keys
      - lakeflow
      - unity-catalog
      - delta-lake
      - databricks-sql
      - aibi
      - mosaic-ai
      - lakebase
      - compute
      - apps-ecosystem
      - workspace
      - security
      - other
    refresh: |
      cd ProductEvolution && ./refresh.sh
      # Default: auto-commits + pushes regenerated files to origin (no-op when data unchanged).
      # --local-only: skip git operations, preview only.
      # For LLM-quality buckets (vs keyword fallback):
      #   export ANTHROPIC_API_KEY=sk-ant-...
      #   ./refresh.sh
    cadence: "Manual weekly or monthly. Cost is ~$0.01 per refresh on Haiku 4.5."
    determinism: |
      feature-timeline.py stamps SVG headers with the latest event date in the bucket
      (not datetime.now()), so identical input -> identical PNG bytes -> zero git diff
      and no commit. New events on a refresh = real commit + push.

# ------------------------------------------------------------
# How to regenerate
# ------------------------------------------------------------
regeneration:
  trigger: |
    Re-run the original prompt:
    "Generate L100-L400 + Anti-patterns + Weaknesses docs for every product
    listed in _control.yaml with status pending or needs-update. Write md + html
    to <output_root>/<folder>/<name>.{md,html}. Keep Glossary in sync."
  rules:
    - Treat this file as the source of truth — do not generate products absent from this list.
    - If a product already has status=complete, skip unless flagged needs-update.
    - When adding a new product: append to the products list with status=pending; re-run.
    - When a referenced term is missing from Glossary, add it before publishing.
    - Cross-cutting Topics (Storage, Compute) follow the same L100→L400 template; treat them as products.
    - The `topics:` block (Product Evolution, Feature Timelines) is NOT covered by this prompt — those have their own refresh tooling under ProductEvolution/.
    - When adding ANY new product or topic, also update index.html and index.md (Cross-cutting Topics section, category sections, and Feature Timelines grid if applicable).
